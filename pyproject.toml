[project]
name = "broker"
version = "0.1.0"
description = "In-memory pub/sub broker prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.0",
    "httpx>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
